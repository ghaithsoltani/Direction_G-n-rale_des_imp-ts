spring:
  application:
    name: dgi-immatriculation-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dgi_immatriculation}
    username: ${DB_USERNAME:dgi_user}
    password: ${DB_PASSWORD:dgi_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  management:
    endpoints:
      web:
        exposure:
          include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:VotreCleSecreteDGIImmatriculationAuMoins256BitsDeRandom}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  stockage:
    chemin-racine: ${STOCKAGE_CHEMIN_RACINE:/var/dgi/documents}

  ocr:
    tessdata-path: ${OCR_TESSDATA_PATH:/opt/tessdata}
    langue: ${OCR_LANGUE:ara+fra}

  face-verification:
    seuil-acceptation: ${FACE_SEUIL_ACCEPTATION:0.75}
    cascade-path: ${FACE_CASCADE_PATH:/opt/opencv/haarcascade_frontalface_default.xml}

  llm:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
    model: ${LLM_MODEL:llama-3.1-70b-versatile}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    tn.gov.dgi: ${LOG_LEVEL_DGI:INFO}
    org.springframework.security: WARN
    org.hibernate: WARN
