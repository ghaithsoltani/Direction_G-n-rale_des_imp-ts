<div class="fixed right-4 top-4 z-50 flex w-full max-w-sm flex-col gap-2">
    @for (toast of toastService.toasts(); track toast.id) {
    <div class="rounded-xl border px-4 py-3 text-sm shadow-lg" [ngClass]="{
        'border-green-200 bg-green-50 text-green-800': toast.type === 'success',
        'border-red-200 bg-red-50 text-red-800': toast.type === 'error',
        'border-blue-200 bg-blue-50 text-blue-800': toast.type === 'info'
      }">
        <div class="flex items-start justify-between gap-3">
            <span>{{ toast.message }}</span>
            <button type="button" class="text-xs font-semibold opacity-70 hover:opacity-100"
                (click)="toastService.fermer(toast.id)">
                ✕
            </button>
        </div>
    </div>
    }
</div>
